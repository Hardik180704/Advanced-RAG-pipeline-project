apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag
data:
  # "faiss" needs the index inside the pod (see vectorstore/ build step).
  # For multi-replica deployments set VECTOR_DB=pinecone and configure the index.
  VECTOR_DB: "faiss"
  OPENAI_CHAT_MODEL: "gpt-4o-mini"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
  RERANKER: "cross-encoder"
  VECTOR_TOP_K: "6"
  BM25_TOP_K: "6"
  HYBRID_TOP_K: "10"
  RERANK_TOP_K: "4"
  MIN_RERANK_SCORE: "-4.0"
  MAX_CONTEXT_CHARS: "8000"
  MEMORY_WINDOW: "4"
