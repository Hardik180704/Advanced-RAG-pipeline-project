# Template only — do NOT commit real keys.
# Create the secret imperatively instead:
#   kubectl -n rag create secret generic rag-secrets \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=PINECONE_API_KEY=pcsk-...
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  PINECONE_API_KEY: "REPLACE_ME"
